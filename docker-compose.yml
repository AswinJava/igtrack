services:
  db:
    image: postgres:16-alpine
    container_name: igtrack-db
    environment:
      POSTGRES_USER: igtrack
      POSTGRES_PASSWORD: igtrack
      POSTGRES_DB: igtrack
    ports:
      - "5432:5432"
    volumes:
      - igtrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igtrack -d igtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  igtrack_pgdata:
